      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate project sources
        run: python3 scripts/validate_project.py

      - name: Run unit tests and compile APK
        run: gradle --no-daemon -p android :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Validate APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk | tail -n 1
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -F classes.dex

      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AIPhotoStudio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
